name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 「Actions」タブから手動でも流せる
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1度に1つだけ。走行中のものは中断せず、待ってから次を流す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 出題ロジック・巻とループ・エンディング判定のテスト
      - run: npm test

      - run: npm run lint

      # 実素材がリポジトリに入っていなければ、ダミーを生成してから配信する。
      # ID はシードから決まるので、コミット済みの clips.json と必ず一致する
      - run: npm run gen:dummy:if-missing

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

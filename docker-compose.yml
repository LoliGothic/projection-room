services:
  app:
    build: .
    image: projection-room-dev
    container_name: projection-room
    ports:
      - "5173:5173"   # Vite 開発サーバー
      - "4173:4173"   # vite preview（本番ビルドの確認用）
    volumes:
      - .:/app                 # ソースをバインドマウント
      - node_modules:/app/node_modules  # node_modules は名前付きボリューム
      - ./raw:/app/raw         # 素材の作業フォルダ（正規化前）
    environment:
      # macOS/Windows のバインドマウントは inotify を取りこぼすため polling を使う
      - CHOKIDAR_USEPOLLING=true
      - VITE_HMR_POLL=1
    command: sh -c "npm install && npm run gen:dummy:if-missing && npm run dev -- --host 0.0.0.0"
    stdin_open: true
    tty: true

volumes:
  node_modules:
